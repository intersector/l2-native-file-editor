[package]
name = "l2-file-editor"
version = "0.1.0"
description = "L2 File Editor: a cross-platform GUI shell over the l2dat CLI"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "l2_file_editor_lib"

[[bin]]
name = "l2-file-editor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-store = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
uuid = { version = "=1.28.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[profile.release]
lto = true
codegen-units = 1
strip = true
